{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Sign in</h1>
  <form class="stack" method="post">{{ csrf() }}
    <input type="hidden" name="next" value="{{ target }}">
    <p><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></p>
    <p><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></p>
    <button type="submit">Sign in</button>
  </form>
  {% if sso_enabled %}
  <form method="post" action="{{ url_for('sso.start') }}">{{ csrf() }}
    <input type="hidden" name="next" value="{{ target }}">
    <button class="outline">Continue with {{ sso_label }}</button>
  </form>
  {% endif %}
  <p><a href="{{ url_for('auth.reset') }}">Forgot your password?</a></p>
  <p><a href="{{ url_for('auth.request_new_account') }}">Request an account</a></p>
</section>
{% endblock %}
