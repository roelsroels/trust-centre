{% extends "base.html" %}
{% block title %}Authenticator verification{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Authenticator verification</h1>
  <p>Enter the current code from your authenticator to finish signing in.</p>
  <form class="stack" method="post" action="{{ url_for('auth.authenticator', next=target) }}">{{ csrf() }}
    <p><label for="otp">Authenticator code</label>
      <input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" required></p>
    <button type="submit">Verify code</button>
  </form>
</section>
{% endblock %}
