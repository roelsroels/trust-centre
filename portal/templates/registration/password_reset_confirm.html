{% extends "base.html" %}
{% block title %}Choose a password{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Choose a password</h1>
  {% if validlink %}
    <form class="stack" method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Save password</button></form>
  {% else %}<p>This link has expired or already been used.</p><a href="{% url 'password_reset' %}">Request a fresh link</a>{% endif %}
</section>
{% endblock %}
